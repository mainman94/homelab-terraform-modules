name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Every binary the hooks shell out to — tofu, tflint, terraform-docs,
      # actionlint — plus python and pre-commit itself, all at the versions
      # in mise.toml. That file is the only place a version is written down.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      # A README whose generated block is stale fails here: the hook rewrites
      # it and pre-commit reports the file as modified.
      - name: Run every hook
        run: pre-commit run --all-files --show-diff-on-failure

  test:
    name: tftest (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [backblaze, cloudflare, github]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4

      # The suites use mock_provider, so no credentials are needed — but the
      # providers still have to be downloaded before `tofu test` can plan.
      - name: Validate and test
        working-directory: modules/${{ matrix.module }}
        run: |
          tofu init -backend=false -input=false
          tofu validate
          tofu test

  scan:
    name: trivy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Scan module config
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: modules
          format: sarif
          output: trivy.sarif
          # Advisory: findings land in the Security tab rather than blocking
          # a PR on a rule nobody has triaged yet.
          exit-code: "0"

      - uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: trivy.sarif
